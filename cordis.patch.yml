# 把「手机远程接管 DSH」的宿主插件插入 profile。
#
# 网络结构：手机 → 你的服务器 8.152.5.127:7788 → SSH 反向隧道 → 本机 127.0.0.1:7788
# 隧道是本机主动 ssh -R 连出去的，所以监听回环地址就够了，不必暴露到局域网。
#
# 可选配置项（都可以删掉，删掉即用默认值）：
# - publicOrigin：手机入口的固定公网地址。二维码里默认编的就是它。
#     留空时会依次退回：隧道上报的地址 → http://<局域网 IP>:7788。
#     没搭隧道又留空，二维码就会编局域网地址，手机扫码直连必然失败——那就填上公网地址。
# - tunnelUrlFile：隧道把最新地址写进某个文件时，插件会读这个文件当作入口地址。
# - tunnel.*：让插件自己托管一条 SSH 反向隧道（每台电脑占一个远端端口）。
# - host：监听地址，默认 '0.0.0.0'。
#     改成 '127.0.0.1' 就只监听本机——那样手机只能走隧道，直连局域网 IP 会「无法访问」。
# - maxDevices：同时可绑定的手机台数，默认 1（新设备配对会踢掉旧的）。
- insert:
    - id: mobile-remote
      name: '@local/dsh-mobile-remote'
      config:
        host: '127.0.0.1'
        port: 7788
        # 手机永远走服务器，二维码里就编这个地址，跟连哪个 Wi-Fi 无关。
        publicOrigin: 'http://8.152.5.127:7788'
