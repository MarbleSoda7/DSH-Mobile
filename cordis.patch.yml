# 把「手机远程接管 DSH」的宿主插件插入 profile。
#
# 网络结构（单机）：手机 → 公网服务器:端口 → SSH 反向隧道 → 本机 127.0.0.1:7788
# 隧道是本机主动 ssh -R 连出去的，所以监听回环地址就够了，不必暴露到局域网。
#
# ⚠️ 这里**故意不写任何公网地址和端口**。
#    入口地址是每台机器各不相同的，写死一个值等于所有克隆这个仓库的机器共用一个
#    端口 / 一个公网地址——后来者要么隧道起不来，要么二维码把手机指到别人电脑上
#    （表现就是「码没过期却提示配对码无效」）。
#    每台机器在装好之后，打开 http://127.0.0.1:7788/admin 选一次自己的端口槽位即可，
#    选择落在本机 stateDir/local.json 里，不进 git。
#
# 服务器上预留 5 个端口（每台电脑占一个）：
#     槽位 1 → 1000    槽位 2 → 1010    槽位 3 → 1020
#     槽位 4 → 1030    槽位 5 → 1040
#   端口台阶由 local.json 里的 remotePortBase（默认 1000）和 remotePortStep（默认 10）决定。
#
#   ⚠️ 只有「多台电脑共用同一台服务器」时才需要选槽位，而且服务器上那 5 个端口
#      必须真的各有一条隧道在听，否则二维码会编出一个没人接的端口。
#      单人使用（每台电脑一个端口都能通、或者走 publicOrigin 的固定端口）时，
#      槽位留空即可，二维码直接用 publicOrigin。
#
# 可选配置项（都可以删掉，删掉即用默认值）：
# - publicOrigin：兜底的固定公网地址。只有在还没选端口槽位时才用得上，平时留空。
# - tunnelUrlFile：隧道把最新地址写进某个文件时，插件会读这个文件当作入口地址。
# - tunnel.*：让插件自己托管一条 SSH 反向隧道。
#     enabled / server / user / keyPath 必填，remotePort 由端口槽位决定，一般不用写。
# - host：监听地址，默认 '0.0.0.0'。
#     改成 '127.0.0.1' 就只监听本机——那样手机只能走隧道，直连局域网 IP 会「无法访问」。
# - maxDevices：同时可绑定的手机台数，默认 1（新设备配对会踢掉旧的）。
- insert:
    - id: mobile-remote
      name: '@local/dsh-mobile-remote'
      config:
        host: '127.0.0.1'
        port: 7788
        # publicOrigin 留空：入口地址由每台机器在 /admin 里选的端口槽位决定。
        # 只有在你完全不用隧道、只想固定填一个公网地址时才打开下面这一行。
        # publicOrigin: 'http://你的服务器地址:你的端口'
