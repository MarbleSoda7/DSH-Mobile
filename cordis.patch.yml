# 把「手机远程接管 DSH」的宿主插件插入 profile。
#
# 网络结构：手机 → 公网服务器 9xxx → 内置隧道（纯 Node）→ 本机 7788 → DSH
#
# 服务器地址写死在 lib/index.js 里，端口由服务器分配，本机没有任何可选项——
# 所以这里只留最基本的两个值，其余全部用默认值。
#
# 默认行为：
# - 第一次启动向服务器 /api/claim 报到，拿一个 9000-9099 里的端口；
# - 之后每次启动拿 deviceId + secret 续约，端口不变；
# - 隧道断开自动重连，服务器不认 token 时自动重领一份新的。
#
# 可选配置项（都可以删掉，删掉即用默认值）：
# - host：监听地址，默认 '0.0.0.0'。
#     监听所有网卡时，手机和电脑在同一个 WiFi 下可以直接访问局域网 IP，不依赖服务器；
#     改回 '127.0.0.1' 就只走隧道。
# - port：监听端口，默认 7788。隧道倒流量的目标端口也是它。
# - stateDir：identity.json / devices.json 等状态文件的目录，
#     默认 ~/.dsh/dsh-mobile-remote。
# - maxDevices：同时可绑定的手机台数，默认 1（新设备配对会踢掉旧的），0 = 不限。
# - pairCodeTtlMs：配对码有效期，默认 120000（2 分钟），一次性。
# - autoReload：lib/*.js 改动后自动重载，默认 true。
# - publicOrigin：兜底的固定入口地址，平时留空——用服务器分配的端口。
# - tunnel.localPort：隧道倒给本机的哪个端口，默认 7788。
# - tunnel.frpServerPort：服务器隧道控制端口，默认 7789，一般不用改。
- insert:
    - id: mobile-remote
      name: '@dsh-plugin/mobile-remote'
      config:
        host: '0.0.0.0'
        port: 7788
        # publicOrigin 留空：入口地址由服务器分配的端口决定。
        # 只有在你完全不用内置隧道、想固定填一个公网地址时才打开下面这一行。
        # publicOrigin: 'http://你的服务器地址:你的端口'
