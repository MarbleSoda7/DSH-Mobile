<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>手机接管 DSH</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0e1014;
    --card: #16191f;
    --card-2: #1c2028;
    --line: #262b35;
    --text: #e8ebf1;
    --dim: #8d97a8;
    --accent: #4d8dff;
    --accent-soft: rgba(77, 141, 255, .12);
    --ok: #37c98b;
    --warn: #e8b04a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(900px 520px at 50% -180px, #1b2333 0%, var(--bg) 62%) fixed;
    color: var(--text);
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 40px 20px 72px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .head { margin-bottom: 30px; }
  .head h1 { margin: 0 0 8px; font-size: 26px; font-weight: 650; letter-spacing: .2px; }
  .head p { margin: 0; color: var(--dim); font-size: 14px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .brand-mark {
    width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
    background: linear-gradient(145deg, #4d8dff, #2f63d8); box-shadow: 0 6px 18px rgba(77,141,255,.32);
  }
  .brand-mark svg { width: 20px; height: 20px; fill: #fff; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 18px;
  }
  .card h2 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
  .card .sub { margin: 0 0 20px; color: var(--dim); font-size: 13.5px; }

  .pair { display: flex; gap: 26px; flex-wrap: wrap; }
  .qr-box {
    background: #fff; border-radius: 14px; padding: 14px; flex: 0 0 auto;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .qr-box img, .qr-fallback { width: 240px; height: 240px; display: block; }
  .qr-fallback {
    display: none; place-items: center; text-align: center;
    color: #333; font-size: 13px; line-height: 1.7; padding: 16px;
  }
  .pair-side { flex: 1 1 250px; min-width: 240px; display: flex; flex-direction: column; gap: 14px; }

  .field label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 7px; }
  input, select {
    width: 100%; padding: 11px 13px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card-2); color: var(--text);
    font-size: 14px; font-family: inherit; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input::placeholder { color: #5d6676; }

  .link-box {
    background: var(--card-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 13px; font-size: 13px; word-break: break-all; color: #b9c7de;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .meta { display: flex; gap: 18px; font-size: 13px; color: var(--dim); flex-wrap: wrap; }
  .meta b { color: var(--text); font-weight: 600; }
  .meta code {
    background: var(--card-2); border: 1px solid var(--line); border-radius: 6px;
    padding: 1px 7px; color: #b9c7de; font-size: 12.5px;
  }

  button {
    font: inherit; cursor: pointer; border-radius: 10px; padding: 11px 18px;
    border: 1px solid transparent; transition: filter .15s, background .15s, border-color .15s;
  }
  button:active { filter: brightness(.94); }
  .primary {
    background: linear-gradient(180deg, #5a97ff, #3d7bf0); color: #fff; font-weight: 600;
    box-shadow: 0 6px 16px rgba(77,141,255,.28);
  }
  .ghost { background: transparent; border-color: var(--line); color: #c3ccdb; }
  .ghost:hover { background: var(--card-2); }
  .danger { background: transparent; border-color: #3a2b2f; color: #ef8a8a; padding: 6px 12px; font-size: 13px; }
  .danger:hover { background: #241a1d; }

  .dev-list { display: flex; flex-direction: column; gap: 10px; }
  .dev {
    display: flex; align-items: center; gap: 14px;
    background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px;
  }
  .dev.off { opacity: .5; }
  .dev-icon {
    width: 34px; height: 34px; border-radius: 9px; flex: 0 0 auto; display: grid; place-items: center;
    background: #202632; color: #8aa0c0;
  }
  .dev-icon svg { width: 17px; height: 17px; fill: currentColor; }
  .dev-main { flex: 1 1 auto; min-width: 0; }
  .dev-name { font-size: 14px; font-weight: 550; }
  .dev-sub { font-size: 12.5px; color: var(--dim); margin-top: 2px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px rgba(55,201,139,.6); }

  .empty { color: var(--dim); font-size: 14px; padding: 8px 0; }
  .hint { font-size: 12.5px; color: var(--dim); margin: 10px 0 0; }
  .adv { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 18px; }
  .adv summary { cursor: pointer; color: var(--dim); font-size: 13px; list-style: none; user-select: none; }
  .adv summary::-webkit-details-marker { display: none; }
  .adv summary::before { content: '▸ '; }
  .adv[open] summary::before { content: '▾ '; }
  .adv-grid { display: grid; gap: 14px; margin-top: 16px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }

  .save-row { margin-top: 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .toast { font-size: 13px; color: var(--ok); }
  .warn-text { font-size: 13px; color: var(--warn); }

  .chan {
    margin-top: 20px; background: var(--card-2); border: 1px solid var(--line);
    border-radius: 13px; padding: 16px 18px;
  }
  .chan-head { display: flex; align-items: flex-start; gap: 18px; flex-wrap: wrap; }
  .chan-head > div:first-child { flex: 1 1 300px; }
  .chan-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .chan-sub { font-size: 13px; color: var(--dim); line-height: 1.6; }
  .chan-head select { width: 210px; flex: 0 0 auto; }
  .chan-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--line);
    font-size: 13px; color: var(--dim);
  }
  .chan-foot b { color: #9dbcff; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm0 3v12h10V5H7Zm4 13.5h2v1.2h-2v-1.2Z"/></svg>
      </span>
      <div>
        <h1>手机接管 DSH</h1>
      </div>
    </div>
    <p>用手机扫一下二维码，就能在手机上继续用这台电脑的 DSH。这个页面只在你自己的电脑上打开。</p>
  </div>

  <div class="card">
    <h2>用手机扫码绑定</h2>
    <p class="sub">二维码 <b>10 分钟内</b>有效，只能给一台手机用。过期了会自动换一张。</p>

    <div class="pair">
      <div class="qr-box">
        <img id="qr" alt="配对二维码">
        <div id="qr-fallback" class="qr-fallback">二维码没能生成<br>可以手动打开右边的网址</div>
      </div>

      <div class="pair-side">
        <div class="field">
          <label>手机要访问的网址</label>
          <div class="link-box" id="url">正在生成…</div>
        </div>
        <div class="meta">
          <span>配对码 <code id="code">…</code></span>
          <span>还剩 <b id="ttl">…</b></span>
        </div>
        <div>
          <button class="primary" id="btn-new">换一张二维码</button>
        </div>
        <p class="hint" id="conn-hint">扫完码后在手机上等两秒即可进入。如果手机打不开，看看下面「网址不对？」。</p>
      </div>
    </div>

    <div class="chan">
      <div class="chan-head">
        <div>
          <div class="chan-title">这条通道</div>
        </div>
      </div>
      <div class="chan-foot">
        <span id="chan-state">通道 <b id="chan-port">—</b></span>
      </div>
    </div>

    <details class="adv" id="adv">
      <summary>服务器</summary>
      <p class="hint" id="lc-status"></p>
    </details>
  </div>

  <div class="card">
    <h2>已经连接的手机</h2>
    <p class="sub" id="dev-sub">最多保留 1 台。用新手机绑定时，旧手机会自动断开。</p>
    <div class="dev-list" id="devices"></div>
    <p class="hint" id="usage"></p>
  </div>

</div>

<script>
const $ = (id) => document.getElementById(id)
let timer = 0
let rotating = false

// 把错误查出来：以前脚本一炸整页就停在「正在生成…」，用户完全不知道发生了什么。
window.addEventListener('error', (e) => {
  const node = $('url')
  if (node && node.textContent === '正在生成…') node.textContent = '生成失败，请刷新页面重试'
  console.error('admin error', e.message)
})

// 不要在 HTML 里写 src=""：空 src 会立刻触发一次 error 事件，兜底提示就会常驻。
$('qr').onload = () => { $('qr').style.display = 'block'; $('qr-fallback').style.display = 'none' }
$('qr').onerror = () => { $('qr').style.display = 'none'; $('qr-fallback').style.display = 'grid' }

const esc = (text) => String(text == null ? '' : text).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

function fmt(ts) {
  if (!ts) return '—'
  const d = new Date(ts)
  const now = new Date()
  const hm = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`
  if (d.toDateString() === now.toDateString()) return `今天 ${hm}`
  return `${d.getMonth() + 1}月${d.getDate()}日 ${hm}`
}

function ago(ts) {
  if (!ts) return '还没用过'
  const min = (Date.now() - ts) / 60000
  if (min < 2) return '刚刚还在用'
  if (min < 60) return `${Math.round(min)} 分钟前用过`
  const hour = min / 60
  if (hour < 24) return `${Math.round(hour)} 小时前用过`
  return `${Math.round(hour / 24)} 天前用过`
}

const PHONE_ICON = '<svg viewBox="0 0 24 24"><path d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm0 3v12h10V5H7Zm4 13.5h2v1.2h-2v-1.2Z"/></svg>'

async function loadDevices() {
  const res = await fetch('/api/devices')
  const data = await res.json()
  const box = $('devices')
  box.innerHTML = ''
  const active = (data.devices || []).filter((d) => !d.revoked)
  const revoked = (data.devices || []).filter((d) => d.revoked).slice(-3).reverse()

  if (active.length === 0 && revoked.length === 0) {
    const div = document.createElement('div')
    div.className = 'empty'
    div.textContent = '还没有手机绑定过。扫上面的二维码就行。'
    box.appendChild(div)
  }

  for (const device of active) {
    const row = document.createElement('div')
    row.className = 'dev'
    row.innerHTML = `<span class="dev-icon">${PHONE_ICON}</span>
      <div class="dev-main">
        <div class="dev-sub"><span class="dot on"></span>已连接 · ${esc(ago(device.lastSeenAt))} · ${fmt(device.createdAt)} 绑定</div>
      </div>
      <button class="danger" data-id="${esc(device.id)}">断开</button>`
    box.appendChild(row)
  }

  for (const device of revoked) {
    const row = document.createElement('div')
    row.className = 'dev off'
    row.innerHTML = `<span class="dev-icon">${PHONE_ICON}</span>
      <div class="dev-main">
        <div class="dev-sub">已断开 · ${device.revokedAt ? fmt(device.revokedAt) : '—'}</div>
      </div>`
    box.appendChild(row)
  }

  for (const btn of box.querySelectorAll('button[data-id]')) {
    btn.onclick = async () => {
      btn.disabled = true
      btn.textContent = '断开中…'
      await fetch('/api/devices/revoke', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: btn.dataset.id }) })
      loadDevices()
    }
  }

  $('dev-sub').textContent = active.length
    ? '这台手机现在可以直接打开 DSH。点「断开」可以让它立刻失效。'
    : '还没有手机连着。扫上面的二维码就能连上。'
  const u = data.usage || {}
  const mb = (u.bytesOut || 0) / 1024 / 1024
  $('usage').textContent = mb > 0.05 ? `本次运行共用掉约 ${mb.toFixed(1)} MB 流量。` : ''
}

// 老版本页面有个「对外地址」输入框，值存在 localStorage 里。那个值现在没用了
// （服务器地址写死、端口由服务器分配），发现就清掉，省得以后又冒出来。
function dropLegacyOrigin() {
  if (localStorage.getItem('mr.admin.origin')) localStorage.removeItem('mr.admin.origin')
}

async function newCode() {
  const res = await fetch('/api/paircode')
  const data = await res.json()
  if (!data.ok) {
    $('url').textContent = data.error || '生成失败，请稍后重试'
    return
  }
  $('code').textContent = data.code
  $('url').textContent = data.url
  $('qr').src = '/api/qr?format=png&text=' + encodeURIComponent(data.url) + '&v=' + Date.now()
  clearInterval(timer)
  timer = setInterval(() => {
    const left = Math.max(0, Math.round((data.expiresAt - Date.now()) / 1000))
    $('ttl').textContent = left > 0 ? `${left} 秒` : '已过期，正在换新…'
    if (left === 0) clearInterval(timer)
    // 快过期时自动换一张新码：手机扫到时永远不会拿到失效的码
    else if (left <= 45 && !rotating) {
      rotating = true
      newCode().finally(() => { rotating = false })
    }
  }, 1000)
}

/* ---- 通道 ------------------------------------------------------------------
 * 端口由服务器上的 dsh-api 按先来后到分配，本机不能选，所以这里只显示结果。 */
function renderSlots(data) {
  const portNode = $('chan-port')
  if (!portNode) return
  if (!data.port) {
    portNode.textContent = data.state === 'pending' || data.state === 'claiming' ? '登记中…' : '未登记'
    return
  }
  portNode.textContent = `端口 ${data.port}`
}

function renderStatus(data, message) {
  const node = $('lc-status')
  if (node) node.textContent = message || ''
  const hint = $('conn-hint')
  if (!hint) return
  const target = (data && (data.origin || data.fallbackOrigin)) || ''
  hint.innerHTML = target ? '' : '正在向服务器登记这台电脑…'
}

async function loadConfig() {
  const res = await fetch('/api/identity')
  const data = await res.json()
  if (!data || !data.ok) { renderStatus({}); return {} }
  renderSlots(data)
  renderStatus(data)
  return data
}

$('btn-new').onclick = newCode

/* 启动。普通 <script> 里不能写顶层 await（会直接 SyntaxError，整段脚本都不执行），
 * 所以套一层 async 函数。 */
async function boot() {
  dropLegacyOrigin()
  await loadConfig()
  loadDevices()
  setInterval(loadDevices, 5000)
  await newCode()
}

boot().catch((err) => {
  console.error(err)
  $('url').textContent = '页面加载失败，请刷新重试'
})
</script>
</body>
</html>
